name: Actualización semanal

# Se ejecuta todos los lunes a las 8:00 UTC (después del fin de semana de carrera) y también a mano
# desde la pestaña Actions -> "Actualización semanal" -> Run workflow.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: 'Temporada a actualizar (vacío = año en curso)'
        required: false
        default: ''

# El workflow necesita escribir en el repositorio para hacer el commit automático de los datos nuevos.
permissions:
  contents: write

# Evita que dos ejecuciones se pisen (p. ej. una programada y una manual a la vez).
concurrency:
  group: actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Decidir el año
        id: anio
        run: |
          ANIO="${{ github.event.inputs.year }}"
          echo "year=${ANIO:-$(date -u +%Y)}" >> "$GITHUB_OUTPUT"

      # Caché de FastF1 (cache/) y de los datos brutos descargados (data/raw/, que no se sube al repositorio).
      # La clave incluye el id de la ejecución para que SIEMPRE se guarde el estado nuevo; restore-keys
      # recupera el más reciente del mismo año. Así cada lunes solo se descargan las carreras nuevas.
      - name: Restaurar caché de FastF1 y datos brutos
        uses: actions/cache@v4
        with:
          path: |
            cache
            data/raw
          key: f1-datos-${{ steps.anio.outputs.year }}-${{ github.run_id }}
          restore-keys: |
            f1-datos-${{ steps.anio.outputs.year }}-
            f1-datos-

      - name: Tests (antes de actualizar)
        run: python -m pytest -q

      - name: Ejecutar el pipeline
        run: python src/pipeline.py --year ${{ steps.anio.outputs.year }}

      # Segunda pasada de tests: valida los datos recién generados ANTES de hacer commit.
      - name: Tests (con los datos nuevos)
        run: python -m pytest -q

      # El resumen usa la API de Anthropic. La clave vive en el secret ANTHROPIC_API_KEY (nunca en el código).
      # Si el secret no existe, summary.py avisa y termina sin error. Un fallo de la API no debe impedir
      # guardar los datos, por eso continue-on-error.
      - name: Resumen de la última carrera (Anthropic)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python src/summary.py --year ${{ steps.anio.outputs.year }}

      - name: Commit automático de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualización automática $(date -u +%F)"
            git push
          fi
